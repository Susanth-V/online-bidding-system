<!DOCTYPE html>
<html>
<head>
<title>Auctioneer Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card small-card">

<h2>Auctioneer Panel</h2>

<h3>Start Auction</h3>

<select id="auctionType">
<option value="high">Highest Bid</option>
<option value="low">Lowest Bid</option>
<option value="second">Second Price</option>
<option value="multi">Multivariable</option>
</select>

<input id="auctionTime" placeholder="Auction Time (seconds)">

<button onclick="startAuctioneerAuction()">Start Auction</button>

<hr>

<p>Type: <span id="type"></span></p>
<p>Timer: <span id="timer"></span></p>
<p>Winner: <span id="winnerAuctioneer"></span></p>

<hr>

<h3>Bid History</h3>

<table id="auctionHistory"></table>

<button onclick="loadAuctionHistory()">Refresh History</button>

<hr>

<h3>Remove User</h3>

<input id="removeUser" placeholder="Username">
<button onclick="auctioneerRemoveUser()">Remove User</button>

</div>

<script src="script.js"></script>

</body>
</html>
