<!DOCTYPE html>
<html>
<head>
<title>User Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card small-card">

<h2>Current Auction</h2>

<p id="auctionStatus">Auction Not Started</p>

<p>Type: <span id="userAuctionType"></span></p>

<p>Current Winner: <span id="userWinner" class="winner-highlight"></span></p>

<div class="divider"></div>

<h3>Bid History</h3>

<table id="userHistory"></table>

<div class="divider"></div>

<h2>Place Bid</h2>

<input id="bidAmount" placeholder="Enter bid">

<button onclick="placeBid()">Place Bid</button>

</div>

<script src="script.js"></script>

</body>
</html>
