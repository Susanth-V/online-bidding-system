<!DOCTYPE html>
<html>
<head>
<title>User Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if(localStorage.getItem("isUser")!=="true"){
alert("Login first");
window.location.href="user-login.html";
}
</script>

<div class="card small-card">

<h2>Current Auction</h2>

<p id="auctionStatus">Auction Not Started</p>
<p>Type: <span id="userAuctionType"></span></p>
<p>Winner: <span id="userWinner" class="winner-highlight"></span></p>

<div class="divider"></div>

<h3>Bid History</h3>
<table id="userHistory"></table>

<div class="divider"></div>

<input id="bidAmount" placeholder="Enter bid amount">
<button onclick="placeBid()">Place Bid</button>

</div>

<script src="script.js"></script>

</body>
</html>
